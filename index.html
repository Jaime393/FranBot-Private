}
#yape-panel strong { color: #4fc3f7; font-size: 1.2rem; }
#yape-panel img { width: 160px; margin: 12px auto; border-radius: 12px; border: 2px solid #4fc3f7; display: block; }
#yape-panel span { display: block; margin: 8px 0; font-size: 0.9rem; }
#yape-panel a { display: inline-block; background: #2a4; color: #0b0e14; text-decoration: none; padding: 8px 16px; border-radius: 40px; margin: 8px 0; font-weight: bold; }
#yape-panel button { background: #a22; border: none; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; width: 100%; }
#btn-yape { position: fixed; top: 16px; right: 16px; background: #4fc3f7; border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 1.6rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 10000; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
#btn-yape:active { transform: scale(0.95); }
</style>

<button id="btn-yape">💎</button>
<script>
  document.getElementById('btn-yape').addEventListener('click', function() {
    var panel = document.getElementById('yape-panel');
    panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
  });
  document.addEventListener('click', function(e) {
    var panel = document.getElementById('yape-panel');
    var btn = document.getElementById('btn-yape');
    if (!panel.contains(e.target) && e.target !== btn) panel.style.display = 'none';
  });
</script>
